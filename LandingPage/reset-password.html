<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S5QR0VXKTJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-S5QR0VXKTJ');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - mycollegetix</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlurCompat, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2f28, #18453b, #2a6b5a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffed4a);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 24px;
            color: #18453b;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #18453b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #18453b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #18453b;
        }

        .otp-input {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5em;
            font-family: monospace;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #18453b, #2a6b5a);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .message.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .message.info {
            background: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #18453b;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6b7280;
        }

        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            margin: 0 10px;
            position: relative;
        }

        .step.active {
            background: #18453b;
            color: white;
        }

        .step.inactive {
            background: #e5e7eb;
            color: #6b7280;
        }

        .step.completed {
            background: #10b981;
            color: white;
        }

        .step:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 2px;
            background: #e5e7eb;
        }

        .step.completed:not(:last-child)::after {
            background: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="mycollegetixlogo.png" alt="mycollegetix" style="width: 120px; height: 120px; border-radius: 20px; margin: 0 auto 30px; display: block; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); transition: transform 0.3s ease;">
        
        <div class="step-indicator">
            <div class="step active" id="step1">1</div>
            <div class="step inactive" id="step2">2</div>
        </div>
        
        <h1 class="title">Reset Password</h1>
        <p class="subtitle" id="subtitle">Enter the 6-digit code from your email</p>
        
        <div id="message-container"></div>
        
        <!-- Step 1: OTP Verification -->
        <form id="otp-form">
            <div class="form-group">
                <label class="form-label" for="otp">Verification Code</label>
                <input 
                    type="text" 
                    id="otp" 
                    class="form-input otp-input" 
                    placeholder="000000"
                    required
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                >
                <div class="password-requirements">
                    Enter the 6-digit code sent to your email
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="verify-btn">
                Verify Code
            </button>
        </form>
        
        <!-- Step 2: New Password (hidden initially) -->
        <form id="password-form" style="display: none;">
            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Enter your new password"
                    required
                    minlength="6"
                >
                <div class="password-requirements">
                    Password must be at least 6 characters long
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirm-password">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    class="form-input" 
                    placeholder="Confirm your new password"
                    required
                    minlength="6"
                >
            </div>
            
            <button type="submit" class="submit-btn" id="update-btn">
                Update Password
            </button>
        </form>
        
        <div class="loading" id="loading">
            Processing your request...
        </div>
        
        <div class="back-link">
            <a href="https://www.mycollegetix.com/index.html">Back to <span style="color: #FFD700;">my</span>collegetix</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Get URL parameters to extract email
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        
        // Get email from URL (should be passed from the reset link)
        const email = urlParams.get('email') || hashParams.get('email');
        
        // Get Supabase credentials from config
        const { supabaseUrl, supabaseAnonKey } = window.APP_CONFIG;
        
        // Initialize Supabase
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // DOM elements
        const otpForm = document.getElementById('otp-form');
        const passwordForm = document.getElementById('password-form');
        const verifyBtn = document.getElementById('verify-btn');
        const updateBtn = document.getElementById('update-btn');
        const loading = document.getElementById('loading');
        const messageContainer = document.getElementById('message-container');
        const subtitle = document.getElementById('subtitle');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');

        // Global variables to store session
        let userSession = null;

        function showMessage(message, type = 'info') {
            messageContainer.innerHTML = `
                <div class="message ${type}">
                    ${message}
                </div>
            `;
        }

        function updateSteps(currentStep) {
            if (currentStep === 1) {
                step1.className = 'step active';
                step2.className = 'step inactive';
                subtitle.textContent = 'Enter the 6-digit code from your email';
            } else if (currentStep === 2) {
                step1.className = 'step completed';
                step2.className = 'step active';
                subtitle.textContent = 'Enter your new password';
            }
        }

        function showLoading(show = true) {
            if (show) {
                otpForm.style.display = 'none';
                passwordForm.style.display = 'none';
                loading.style.display = 'block';
            } else {
                loading.style.display = 'none';
            }
        }

        function showPasswordForm() {
            otpForm.style.display = 'none';
            passwordForm.style.display = 'block';
            updateSteps(2);
        }

        // Initialize the page
        function initializePage() {
            if (!email) {
                showMessage('No email provided in reset link. Please request a new password reset.', 'error');
                verifyBtn.disabled = true;
                return;
            }
            
            showMessage(`We've sent a 6-digit code to ${email}. Please check your email and enter the code below.`, 'info');
        }

        // Handle OTP verification
        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const otp = document.getElementById('otp').value;
            
            if (!/^\d{6}$/.test(otp)) {
                showMessage('Please enter a valid 6-digit code.', 'error');
                return;
            }
            
            if (!email) {
                showMessage('Email is missing. Please request a new password reset.', 'error');
                return;
            }
            
            showLoading(true);
            
            try {
                console.log('🔐 Verifying OTP for email:', email, 'with code:', otp);
                
                // Use Supabase's verifyOtp method with the 6-digit token
                const { data, error } = await supabase.auth.verifyOtp({
                    email: email,
                    token: otp,
                    type: 'recovery'
                });
                
                if (error) {
                    console.error('❌ OTP verification failed:', error);
                    throw new Error(error.message || 'Invalid or expired verification code');
                }
                
                if (data.user && data.session) {
                    console.log('✅ OTP verified successfully, session established');
                    userSession = data.session;
                    
                    // Set the session in Supabase client
                    await supabase.auth.setSession({
                        access_token: data.session.access_token,
                        refresh_token: data.session.refresh_token
                    });
                    
                    showLoading(false);
                    showMessage('Code verified successfully! Now enter your new password.', 'success');
                    showPasswordForm();
                } else {
                    throw new Error('Verification failed - no session created');
                }
                
            } catch (error) {
                console.error('OTP verification error:', error);
                showLoading(false);
                showMessage(error.message || 'Failed to verify code. Please try again.', 'error');
            }
        });

        // Handle password update
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Enhanced password validation
            if (password !== confirmPassword) {
                showMessage('Passwords do not match. Please make sure both password fields are identical.', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long.', 'error');
                return;
            }
            
            if (password.length > 128) {
                showMessage('Password must be less than 128 characters long.', 'error');
                return;
            }
            
            // Check for basic password strength
            if (password === password.toLowerCase()) {
                if (!confirm('Your password should contain at least one uppercase letter for better security. Continue anyway?')) {
                    return;
                }
            }
            
            if (!/\d/.test(password)) {
                if (!confirm('Your password should contain at least one number for better security. Continue anyway?')) {
                    return;
                }
            }
            
            showLoading(true);
            
            try {
                console.log('🔐 Updating password with established session...');
                
                if (!userSession) {
                    throw new Error('No active session. Please verify your code again.');
                }
                
                // Update the user's password using the established session
                const { error: updateError } = await supabase.auth.updateUser({
                    password: password
                });
                
                if (updateError) {
                    console.error('❌ Password update failed:', updateError);
                    throw new Error(updateError.message || 'Failed to update password');
                }
                
                console.log('✅ Password updated successfully!');
                
                showLoading(false);
                showMessage('Password updated successfully! You can now sign in with your new password.', 'success');
                
                // Redirect after a short delay
                setTimeout(() => {
                    window.location.href = 'https://www.mycollegetix.com/index.html';
                }, 3000);
                
            } catch (error) {
                console.error('Password update error:', error);
                showLoading(false);
                showMessage(error.message || 'Failed to update password. Please try again.', 'error');
            }
        });

        // Add real-time password confirmation validation
        document.getElementById('confirm-password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (confirmPassword && password !== confirmPassword) {
                this.style.borderColor = '#ef4444';
            } else {
                this.style.borderColor = '#e5e7eb';
            }
        });

        // Format OTP input
        document.getElementById('otp').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Initialize the page when DOM loads
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
