<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S5QR0VXKTJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-S5QR0VXKTJ');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - mycollegetix</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlurCompat, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2f28, #18453b, #2a6b5a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffed4a);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 24px;
            color: #18453b;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #18453b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #18453b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #18453b;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #18453b, #2a6b5a);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .message.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #18453b;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6b7280;
        }

        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="mycollegetixlogo.png" alt="mycollegetix" style="width: 120px; height: 120px; border-radius: 20px; margin: 0 auto 30px; display: block; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15); transition: transform 0.3s ease;">
        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Enter your new password below</p>
        
        <div id="message-container"></div>
        
        <form id="reset-form">
            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Enter your new password"
                    required
                    minlength="6"
                >
                <div class="password-requirements">
                    Password must be at least 6 characters long
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirm-password">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    class="form-input" 
                    placeholder="Confirm your new password"
                    required
                    minlength="6"
                >
            </div>
            
            <button type="submit" class="submit-btn" id="submit-btn">
                Update Password
            </button>
        </form>
        
        <div class="loading" id="loading">
            Updating your password...
        </div>
        
        <div class="back-link">
            <a href="https://www.mycollegetix.com/index.html">Back to <span style="color: #FFD700;">my</span>collegetix</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Get URL parameters to extract tokens
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.slice(1)); // Handle # parameters too
        
        const accessToken = urlParams.get('access_token') || hashParams.get('access_token');
        const refreshToken = urlParams.get('refresh_token') || hashParams.get('refresh_token');
        const type = urlParams.get('type') || hashParams.get('type');
        
        // Check for errors in URL
        const error = urlParams.get('error') || hashParams.get('error');
        const errorDescription = urlParams.get('error_description') || hashParams.get('error_description');
        
        // Get Supabase credentials from config
        const { supabaseUrl, supabaseAnonKey } = window.APP_CONFIG;
        
        // Initialize Supabase
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // DOM elements
        const form = document.getElementById('reset-form');
        const submitBtn = document.getElementById('submit-btn');
        const loading = document.getElementById('loading');
        const messageContainer = document.getElementById('message-container');

        function showMessage(message, isError = false) {
            messageContainer.innerHTML = `
                <div class="message ${isError ? 'error' : 'success'}">
                    ${message}
                </div>
            `;
        }

        // Initialize session setup
        async function initializeSession() {
            // Check for errors first
            if (error) {
                let errorMessage = 'Reset link error: ';
                if (error === 'access_denied' && errorDescription?.includes('expired')) {
                    errorMessage = 'This reset link has expired. Please request a new password reset from the app.';
                } else if (error === 'access_denied') {
                    errorMessage = 'This reset link is invalid or has already been used. Please request a new password reset.';
                } else {
                    errorMessage += errorDescription || error;
                }
                showMessage(errorMessage, true);
                submitBtn.disabled = true;
                return;
            }

            // Check if we have the required tokens
            if (!accessToken || type !== 'recovery') {
                showMessage('Invalid or expired reset link. Please request a new password reset.', true);
                submitBtn.disabled = true;
            } else {
                // Set the session with the tokens (await this!)
                try {
                    const { error: sessionError } = await supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    
                    if (sessionError) {
                        console.error('Session error:', sessionError);
                        showMessage('Invalid reset link. Please request a new password reset.', true);
                        submitBtn.disabled = true;
                    } else {
                        console.log('✅ Session established successfully');
                        showMessage('Ready to reset your password!');
                    }
                } catch (error) {
                    console.error('Failed to set session:', error);
                    showMessage('Invalid reset link. Please request a new password reset.', true);
                    submitBtn.disabled = true;
                }
            }
        }
        
        // Initialize the session
        initializeSession();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match. Please try again.', true);
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long.', true);
                return;
            }
            
            // Show loading state
            form.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                // Update the password
                const { error } = await supabase.auth.updateUser({
                    password: password
                });
                
                if (error) {
                    throw error;
                }
                
                // Success!
                loading.style.display = 'none';
                showMessage('Password updated successfully! You can now sign in with your new password.');
                
                // Redirect after a short delay
                setTimeout(() => {
                    window.location.href = 'https://www.mycollegetix.com/index.html';
                }, 3000);
                
            } catch (error) {
                console.error('Password reset error:', error);
                loading.style.display = 'none';
                form.style.display = 'block';
                showMessage(error.message || 'Failed to update password. Please try again.', true);
            }
        });

        // Add real-time password confirmation validation
        document.getElementById('confirm-password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (confirmPassword && password !== confirmPassword) {
                this.style.borderColor = '#ef4444';
            } else {
                this.style.borderColor = '#e5e7eb';
            }
        });
    </script>
</body>
</html>
