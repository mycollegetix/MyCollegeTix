<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening MyCollegeTix...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #18453b;
            color: white;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .message {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .fallback {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .btn {
            display: inline-block;
            background: white;
            color: #18453b;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="logo">MyCollegeTix</div>
    <div class="message">Opening app...</div>

    <div class="fallback">
        <p>App didn't open automatically?</p>
        <a id="fallback-link" href="mycollegetix://verified" class="btn">Open MyCollegeTix App</a>
    </div>

    <script>
        // Read the ?path= query parameter to build the deep link
        var params = new URLSearchParams(window.location.search);
        var path = params.get('path');
        var deepLink = path ? 'mycollegetix://' + path : 'mycollegetix://verified';

        // Update fallback button
        document.getElementById('fallback-link').href = deepLink;

        // Immediately try to open the app
        window.location.href = deepLink;
    </script>
</body>
</html>
